[package]
name = "shield-core"
version = "1.5.0-beta.2"
edition = "2021"
authors = ["MocikaDev"]
license = "MIT OR Apache-2.0"
description = "Mocika Shield 核心加固与签名能力"
repository = "git@github.com:mocikadev/mocika-shield.git"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = { workspace = true }
which = "8.0"
colored = "3.1"
tempfile = "3.10"
directories = { workspace = true }
dunce = "1"
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
