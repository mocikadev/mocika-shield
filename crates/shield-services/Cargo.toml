[package]
name = "shield-services"
version = "1.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "Mocika Shield 多入口共享应用能力与本地资料"

[dependencies]
shield-core = { path = "../shield-core" }
dirs = "6"
dunce = "1"
toml = "0.8"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
