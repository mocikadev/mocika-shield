[package]
name = "shield-cli"
version = "1.4.3"
edition = "2021"
authors = ["MocikaDev"]
license = "MIT OR Apache-2.0"
description = "Mocika Shield APK 加固命令行工具"
repository = "git@github.com:mocikadev/mocika-shield.git"

[features]
agent-executor = ["dep:rustix", "dep:libc"]
mcp-server = ["agent-executor", "dep:rmcp", "dep:tokio", "dep:tokio-util"]

[[bin]]
name = "shield"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
colored = "3.1"
shield-core = { path = "../../crates/shield-core" }
shield-app = { path = "../../crates/shield-app" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = { workspace = true }
tempfile = "3.20"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "stdio"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1.52", features = ["rt", "macros", "process", "signal", "time", "sync", "io-util", "io-std"], optional = true }
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["fs", "process", "stdio"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
