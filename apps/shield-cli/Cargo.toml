[package]
name = "shield-cli"
version = "1.5.0-beta.1"
edition = "2021"
authors = ["MocikaDev"]
license = "MIT OR Apache-2.0"
description = "Mocika Shield APK 加固命令行工具"
repository = "git@github.com:mocikadev/mocika-shield.git"

[features]
agent-executor = ["dep:rustix", "dep:libc", "dep:windows-sys"]
mcp-server = ["agent-executor", "dep:rmcp", "dep:tokio", "dep:tokio-util"]

[[bin]]
name = "shield"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
colored = "3.1"
shield-core = { path = "../../crates/shield-core" }
shield-services = { path = "../../crates/shield-services" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = { workspace = true }
tempfile = "3.20"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "stdio"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1.52", features = ["rt", "macros", "process", "signal", "time", "sync", "io-util", "io-std", "fs"], optional = true }
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["fs", "process", "stdio"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
libc = "0.2"
