[package]
name = "shield-cli"
version = "1.2.0-rc.1"
edition = "2021"
authors = ["MocikaDev"]
license = "MIT"
description = "Mocika Shield APK 加固命令行工具"
repository = "git@github.com:mocikadev/mocika-shield.git"

[lib]
name = "shield_cli"
path = "src/lib.rs"

[[bin]]
name = "shield"
path = "src/main.rs"

[dependencies]
# 命令行解析
clap = { version = "4.5", features = ["derive", "cargo"] }

# 错误处理
anyhow = "1.0"
thiserror = "2.0"

# 日志
env_logger = "0.11"
log = "0.4"

# 文件操作
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# 压缩（DEX打包）
zstd = { workspace = true }

# 进程执行
which = "8.0"

# 终端输出美化
colored = "3.1"
indicatif = "0.18"

# 临时文件
tempfile = "3.10"

directories = { workspace = true }
dunce = "1"

# 加密（ChaCha20-Poly1305 AEAD + HKDF 密钥派生）
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# DEX header 修复（SHA-1 signature 重算）
sha1 = "0.10"
