  windows-api19-resources:
    name: Windows Android 4.4 资源构建
    if: github.event_name == 'workflow_dispatch' && (inputs.validation_scope == 'all' || inputs.validation_scope == 'windows_resources' || inputs.validation_scope == '')
    runs-on: windows-2025

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 配置 Android SDK / NDK
        shell: pwsh
        run: |
          1..20 | ForEach-Object { "y" } | sdkmanager --licenses | Out-Null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$env:ANDROID_NDK_VERSION" "ndk;$env:ANDROID_NDK_API19_VERSION"
          "ANDROID_NDK_ROOT=$env:ANDROID_HOME\ndk\$env:ANDROID_NDK_VERSION" >> $env:GITHUB_ENV

      - name: 配置 Rust Android 工具链
        shell: pwsh
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.77.2 --profile minimal --target armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: 构建标准与 Android 4.4 兼容资源
        shell: pwsh
        run: |
          .\scripts\build-stub.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SKIP_STANDARD_STUB_BUILD = "1"
          & bash "scripts/build-android-api19-resources.sh"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "shield-stub\build\outputs\resources\resources-api19.zip")) {
            throw "resources-api19.zip 未生成"
          }

