name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  rust:
    name: Rust 与前端检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 检查 Rust 格式
        run: cargo fmt --all --check

      - name: 检查 Rust Clippy
        run: cargo clippy -p shield-core --all-targets -- -D warnings

      - name: 运行核心单元测试
        run: cargo test -p shield-core

      - name: 运行 stub Rust 单元测试
        run: cargo test --manifest-path shield-stub/src/main/rust/Cargo.toml

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 检查 GUI 前端
        working-directory: apps/shield-gui
        run: |
          npm run lint
          npm run typecheck
          npm run build

  linux-gui-bundle:
    name: Linux Tauri 打包冒烟检查
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shield-gui/package-lock.json

      - name: 安装 Linux Tauri 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            patchelf \
            libfuse2

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust target 与构建工具
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          cargo install cargo-ndk --locked
          cargo install tauri-cli --locked

      - name: 安装 GUI 前端依赖
        working-directory: apps/shield-gui
        run: npm ci

      - name: 构建 shield-stub
        run: make build-stub

      - name: 检查 Linux Tauri bundle
        working-directory: apps/shield-gui
        run: cargo tauri build --bundles appimage,deb --debug

  stub:
    name: Android 壳构建
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust Android target
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: 构建 shield-stub
        run: make build-stub

      - name: 上传 resources.zip
        uses: actions/upload-artifact@v7
        with:
          name: resources-zip
          path: shield-stub/build/outputs/resources/resources.zip
          if-no-files-found: error

      - name: 运行端到端加固回归测试
        run: bash tests/scripts/run-protect-e2e.sh

  release-readiness:
    name: 发布前检查
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v4

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust Android target
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: 构建 shield-stub
        run: make build-stub

      - name: 运行发布前检查
        run: bash scripts/check-release-ready.sh
