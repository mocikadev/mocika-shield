name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  rust:
    name: Rust 与前端检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shield-gui/package-lock.json

      - name: 检查 Rust 格式
        run: cargo fmt --all --check

      - name: 运行 CLI 单元测试
        run: cargo test --manifest-path shield-cli/Cargo.toml

      - name: 运行 stub Rust 单元测试
        run: cargo test --manifest-path shield-stub/src/main/rust/Cargo.toml

      - name: 安装 GUI 前端依赖
        working-directory: shield-gui
        run: npm ci

      - name: 检查 GUI 前端
        working-directory: shield-gui
        run: |
          npm run lint
          npm run typecheck
          npm run build

  stub:
    name: Android 壳构建
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android 命令行工具
        uses: android-actions/setup-android@v3

      - name: 配置 Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 配置 Rust Android target
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: 构建 shield-stub
        run: make build-stub

      - name: 上传 resources.zip
        uses: actions/upload-artifact@v7
        with:
          name: resources-zip
          path: shield-stub/build/outputs/resources/resources.zip
          if-no-files-found: error
