    <script>
      (function () {
        var stored = localStorage.getItem("mocika-theme");
        var theme;
        if (stored === "light") {
          theme = "light";
        } else if (stored === "dark") {
          theme = "dark";
        } else {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <div id="root"></div>
